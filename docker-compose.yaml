services:
  postgres_db:
    image: postgres:15-alpine
    container_name: camera_traps_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-camera_traps}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera_traps_app
    restart: always
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      # Configurable through environment variable
      - ${ENV_FILE:-.env}
    environment:
      - DB_HOST=postgres_db
    volumes:
      # Configurable through environment variable
      - ${MODELS_DIR:-./models}:/app/models
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
<!-- Result Container: Grid with Preview Image on the left and Predictions on the right -->
<div style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem; margin-top: 1.5rem;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
    <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff;">Inference Output</h3>
    <span style="font-size: 0.8rem; background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 6px; color: #9ca3af;">
      {{ response.filename }}
    </span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; align-items: start;">

    <!-- Uploaded Image Preview Column -->
    <div style="background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 10px; overflow: hidden;">
      <img src="data:{{ mime_type }};base64,{{ image_b64 }}"
           alt="{{ response.filename }}"
           style="width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: 8px; display: block;" />
      <p style="text-align: center; font-size: 0.75rem; color: #6b7280; margin-top: 8px;">
        Analyzed Frame
      </p>
    </div>

    <!-- Predictions List Column -->
    <div style="display: flex; flex-direction: column; gap: 0.8rem;">
      {% for pred in response.predictions %}
      {% set percentage = (pred.confidence * 100) %}
      <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid {% if loop.first %}rgba(16, 185, 129, 0.35){% else %}rgba(255, 255, 255, 0.06){% endif %}; border-radius: 10px; padding: 12px 14px;">

        <!-- Label and percentage text -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span style="font-weight: 600; font-size: 0.95rem; color: {% if loop.first %}#34d399{% else %}#e5e7eb{% endif %};">
            {% if loop.first %}🏆 {% endif %}{{ pred.class_name }}
          </span>
          <span style="font-weight: 700; font-size: 0.9rem; color: #f3f4f6;">
            {{ "%.1f"|format(percentage) }}%
          </span>
        </div>

        <!-- Confidence Progress Bar -->
        <div style="width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden;">
          <div style="width: {{ percentage }}%; height: 100%; border-radius: 999px; background: {% if loop.first %}linear-gradient(90deg, #10b981, #34d399){% else %}#60a5fa{% endif %}; transition: width 0.6s ease;"></div>
        </div>

      </div>
      {% endfor %}
    </div>

  </div>
</div>

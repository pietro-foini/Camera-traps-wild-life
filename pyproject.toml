[tool.poetry]
name = "camera-traps-wild-life"
version = "1.0.0"
description = "Machine Learning-powered camera trap wildlife"
authors = ["PFoini <pietro.foini1@gmail.com>"]
readme = "README.md"
packages = [{ include = "camera_traps" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "3.0.5"
numpy = "2.4.6"
scikit-learn = "1.9.0"
matplotlib = "3.11.1"
ipywidgets = "8.1.9"
opencv-python = "5.0.0.93"
pillow = "12.3.0"
shapely =  "2.1.2"
tensorflow = { version = "2.21.0", extras = ["and-cuda"] }
torch = { version = "2.14.0", source = "pytorch-cu132" }
torchvision = { version = "0.29.0", source = "pytorch-cu132" }
ultralytics = "8.4.138"
setuptools = "81.0.0"

[tool.poetry.group.dev.dependencies]
isort = "^5.12"
black = "^22"
mypy = "^1.3"
pre-commit = "^4.3.0"
pydocstyle = "^6.3"
notebook = "7.6.2"
traitlets = "5.16.1"
imagesize = "2.0.1"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.7.0"
mock = "^4.0.3"
pytest = "7.1.2"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
/(\n  \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n  | dockerfile\n  | \.md\n  | \.txt\n  | \.gitignore\n  | \.lock\n)/\n
'''

[tool.isort]
skip_glob = ["*/tests/*"]
profile = "black"
line_length = 120

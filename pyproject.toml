[tool.poetry]
name = "camera-traps-wild-life"
version = "1.0.8"
description = "Machine Learning-powered camera trap wildlife"
authors = ["PFoini <pietro.foini1@gmail.com>"]
readme = "README.md"
packages = [{ include = "camera_traps" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# Web App & API
uvicorn = "0.52.4"
fastapi = "0.141.1"
python-multipart = "0.0.32"
jinja2 = "3.1.6"
# Data Processing & Config
numpy = "2.4.6"
pydantic = "2.13.5"
pydantic-settings = "2.8.1"
# Computer Vision & Models
opencv-python-headless = "5.0.0.93"
ai-edge-litert = "2.2.0"

[tool.poetry.group.dev.dependencies]
# Development Tools
isort = "^5.12"
black = "^22"
mypy = "^1.3"
pre-commit = "^4.3.0"
pydocstyle = "^6.3"
# Notebook Environment
notebook = "7.6.2"
traitlets = "5.16.1"
imagesize = "2.0.1"
ipywidgets = "8.1.9"
matplotlib = "3.11.1"
scikit-learn = "1.9.0"
setuptools = "81.0.0"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.7.0"
mock = "^4.0.3"
pytest = "7.1.2"
httpx2 = "2.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
/(\n  \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n  | dockerfile\n  | \.md\n  | \.txt\n  | \.gitignore\n  | \.lock\n)/\n
'''

[tool.isort]
skip_glob = ["*/tests/*"]
profile = "black"
line_length = 120
